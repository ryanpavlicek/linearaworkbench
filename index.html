<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Linear A Research Workbench</title>
    <meta
      name="description"
      content="A browser-based research environment for the undeciphered Linear A script: the full 1,721-inscription corpus, searchable scholarly commentary, accounting verification, cross-linguistic hypothesis testing, and publication-ready exports."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Linear A Research Workbench" />
    <meta
      property="og:description"
      content="Explore the undeciphered Minoan script: 1,721 inscriptions, 37 analysis modules, searchable commentary, and machine-verified Bronze Age accounting."
    />
    <meta
      property="og:url"
      content="https://ryanpavlicek.github.io/linearaworkbench/"
    />
    <meta
      property="og:image"
      content="https://ryanpavlicek.github.io/linearaworkbench/social-preview.jpg"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#11151c" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <!-- Fonts are self-hosted (see scripts/fetch-fonts.mjs) so the app has no
         external runtime dependency — the Linear A glyph font included. -->
    <link
      rel="preload"
      href="fonts/noto-sans-linear-a-linear-a-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="fonts/fonts.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
