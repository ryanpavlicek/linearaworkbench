<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: http://127.0.0.1:* http://localhost:*; object-src 'none'; base-uri 'self'"
    />
    <title>Linear A Research Workbench</title>
    <meta
      name="description"
      content="Browser-based research environment for Linear A: 1,721 corpus entries, searchable scholarly commentary, accounting verification, comparative hypothesis testing, and offline-capable exports."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Linear A Research Workbench" />
    <meta
      property="og:description"
      content="Explore the Linear A corpus: 1,721 entries, searchable commentary, Bronze Age accounting verification, and comparative sign analysis."
    />
    <meta property="og:url" content="https://linearaworkbench.xyz/" />
    <meta
      property="og:image"
      content="https://linearaworkbench.xyz/social-preview.jpg"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#11151c" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <!-- Fonts are self-hosted (see scripts/fetch-fonts.mjs) so the app has no
         external runtime dependency — the Linear A glyph font included. -->
    <link
      rel="preload"
      href="fonts/noto-sans-linear-a-linear-a-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="fonts/fonts.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
