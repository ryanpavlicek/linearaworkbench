name: Deploy to GitHub Pages

# Deploys only after CI succeeds on main (a commit that fails typecheck,
# tests, or the e2e smoke never reaches Pages). Manual runs are still
# available via workflow_dispatch.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Allow only one concurrent deployment, no in-flight cancellation
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Deploy the exact commit CI validated (empty on manual runs,
          # which then build the branch head).
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - run: npm run build
        env:
          # The site is served at the domain root (linearaworkbench.xyz,
          # configured in Settings → Pages), so Vite asset URLs resolve
          # from /. If the custom domain is ever dropped, this must go back
          # to /<repo>/ for the github.io project path.
          BASE_URL: /
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
