name: Release Linear A images

# Builds a single tar.gz of public/upstream/images and publishes it as a
# release asset, so pyaegean's aegean.data.fetch() can download (never
# re-host) it. Run manually from the Actions tab.
#
# Release tags are IMMUTABLE: pyaegean pins the asset URL + sha256, so an
# existing asset must never be replaced in place — publish new content under
# a bumped tag (lineara-images-v2, -v3, …) and re-pin downstream. The tar is
# built deterministically (sorted entries, zeroed owners/mtime, gzip -n) so
# the same input bytes always produce the same sha256.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (immutable; bump the suffix for new content, e.g. lineara-images-v2)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Refuse to overwrite an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Tags are immutable — bump the version suffix instead."
            exit 1
          fi

      - name: Build images tarball (deterministic)
        run: |
          tar --sort=name --owner=0 --group=0 --numeric-owner \
              --mtime='UTC 2020-01-01' \
              -cf - -C public/upstream images | gzip -n > lineara-images.tar.gz
          ls -lh lineara-images.tar.gz
          sha256sum lineara-images.tar.gz | tee sha256.txt
          {
            echo '### lineara-images.tar.gz'
            echo '```'
            cat sha256.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          notes="Facsimiles/photographs of Linear A inscriptions. © École Française d'Athènes and other rightsholders; redistributed for academic reference only. Fetched (not re-hosted) by pyaegean via aegean.data.fetch('lineara-images')."
          gh release create "$TAG" lineara-images.tar.gz \
            --title "Linear A imagery" --notes "$notes"
